[project]
name = "billbench"
version = "0.1.0"
description = "Eval harness benchmarking LLMs on congressional bill summarization against CRS summaries"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "pydantic>=2.7",
  "typer>=0.12",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
billbench = "billbench.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
